[project]
name = "doclyze"
version = "0.1.0"
description = "Document Summarizer via Google Drive Integration"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "google-api-python-client>=2.160.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "python-docx>=1.1.0",
    "pymupdf>=1.25.0",
    "langchain>=0.3.0",
    "langchain-google-genai>=0.1.0",
    "fpdf2>=2.8.0",
    "langchain-text-splitters>=1.1.2",
    "python-multipart>=0.0.28",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
    "gunicorn>=26.0.0",
]
